# Rebuilds the site once a day so new YouTube videos appear without manual action.
name: Daily rebuild

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy hook
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK secret is not set, skipping"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
